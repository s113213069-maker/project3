<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Babylon Navbar - 蘇資晉</title>
    <script src="https://cdn.babylonjs.com/viewer/babylon.viewer.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; line-height: 1.6; }
        .controls { margin-bottom: 15px; }
        select { padding: 8px; font-size: 16px; border-radius: 4px; }
        /* 設定 3D 視窗大小 */
        babylon {
            width: 100%;
            height: 600px;
            display: block;
            border: 2px solid #333;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <a href="index.html" style="color: blue; text-decoration: none;">← 返回首頁</a>
    <h1>Babylon Viewer Navbar (多模型切換展示)</h1>
    <p>學號：113213069 | 姓名：蘇資晉</p>

    <div class="controls">
        <label for="modelSelector">選擇要查看的模型：</label>
        <select id="modelSelector">
            <option value="https://github.com/s113213069-maker/project3/raw/refs/heads/main/113213069.glb">模型一：學號命名模型 (113213069)</option>
            <option value="https://github.com/s113213069-maker/project3/raw/refs/heads/main/my_model.glb">模型二：我的整合模型 (my_model)</option>
        </select>
    </div>

    <babylon id="navViewer" 
             model="https://github.com/s113213069-maker/project3/raw/refs/heads/main/113213069.glb" 
             templates.main.params.show-navbar="true" 
             templates.main.params.show-animation-bar="true"
             telemetry="false">
    </babylon>

    <script>
        const selector = document.getElementById('modelSelector');
        
        selector.addEventListener('change', (event) => {
            const selectedUrl = event.target.value;
            // 透過 API 重新載入選中的遠端模型
            BabylonViewer.viewerManager.getViewerById('navViewer').loadModel({
                url: selectedUrl
            });
        });
    </script>

    <hr>


</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Babylon Animation Select - 蘇資晉</title>
    <script src="https://cdn.babylonjs.com/viewer/babylon.viewer.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; line-height: 1.6; }
        .info { margin-bottom: 15px; }
        /* 設定 3D 展示視窗的大小 */
        babylon {
            width: 100%;
            height: 600px;
            display: block;
            border: 2px solid #333;
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

    <div class="info">
        <a href="index.html" style="color: blue; text-decoration: none;">← 返回首頁 (hello MyFriend)</a>
        <h1>Babylon 模型動作切換展示</h1>
        <p>學號：113213069 | 姓名：蘇資晉</p>
    </div>

    <babylon model="https://raw.githubusercontent.com/s113213069-maker/project3/main/my_model.glb" 
         anim-play="true" 
         templates.main.params.show-animation-bar="true"
         extends-behavior="true"
         telemetry="false">
</babylon>

    <hr>
    <p>💡 **操作說明：**</p>
    <ul>
        <li>載入完成後，點擊視窗下方播放桿左側的動畫名稱，即可切換不同的動作。</li>
        <li>模型較大 (15MB)，若看到轉圈圈請耐心等候載入。</li>
    </ul>

</body>
</html>
